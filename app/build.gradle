plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.example.shotly'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.shotly"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        compose true
        buildConfig = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    kapt {
        correctErrorTypes = true
    }
}

dependencies {
    // Compose BOM
    implementation platform(libs.androidx.compose.bom.v20250801)

    // Core Android
    implementation libs.androidx.core.ktx.v1120
    implementation libs.androidx.lifecycle.runtime.ktx.v270
    implementation libs.androidx.activity.compose.v181

    // Compose
    implementation libs.androidx.compose.ui.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.compose.ui.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.material.icons.extended

    // Navigation Compose
    implementation libs.androidx.navigation.compose.v274

    // ViewModel Compose
    implementation libs.androidx.lifecycle.viewmodel.compose.v270
    implementation libs.androidx.lifecycle.runtime.compose.v270

    // Hilt
    implementation libs.hilt.android
    implementation libs.androidx.hilt.navigation.compose
    kapt libs.hilt.compiler

    // Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    kapt 'androidx.room:room-compiler:2.7.2'

    // Retrofit & OkHttp
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.logging.interceptor

    // Coroutines
    implementation libs.kotlinx.coroutines.android

    // Timber
    implementation libs.timber

    // Permissions
    implementation libs.accompanist.permissions

    // Image Loading
    implementation libs.coil.compose.v250

    // Testing
    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.core.testing
    testImplementation libs.truth
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin

    // UI Testing
    androidTestImplementation libs.androidx.junit.v115
    androidTestImplementation libs.androidx.espresso.core.v351
    androidTestImplementation platform(libs.androidx.compose.bom.v20250801)
    androidTestImplementation libs.androidx.ui.test.junit4

    // Debug
    debugImplementation libs.androidx.compose.ui.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

    implementation libs.material.v1100


}
